name: S&D Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may delay a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = normal run, test = Telegram test message, backtest = compare exits, account = simulate a real account, amd = backtest AMD, smc = backtest SMC sweep-MSS-FVG"
        type: choice
        options: [scan, test, backtest, account, amd, smc]
        default: scan
      balance:
        description: "account mode: starting balance ($)"
        default: "100"
      margin:
        description: "account mode: margin per trade ($)"
        default: "5"
      leverage:
        description: "account mode: leverage (x)"
        default: "10"
      days:
        description: "account mode: last N days"
        default: "30"
      sizing:
        description: "account mode: risk = same $ loss every trade (like live signals), fixed = margin x leverage"
        type: choice
        options: [risk, fixed]
        default: risk
      risk:
        description: "account mode (risk sizing): $ loss if SL is hit"
        default: "1"
      strategy:
        description: "account mode: strategy to simulate"
        type: choice
        options: [smc, sd]
        default: smc

permissions:
  contents: write

concurrency:
  group: sd-signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          TOP_N: ${{ vars.TOP_N }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MIN_SL_PCT: ${{ vars.MIN_SL_PCT }}
          FEE_PCT: ${{ vars.FEE_PCT }}
          TIMEFRAME: ${{ vars.TIMEFRAME }}
          HTF: ${{ vars.HTF }}
          TRAIL_ATR: ${{ vars.TRAIL_ATR }}
          MARGIN_USD: ${{ vars.MARGIN_USD }}
          RISK_USD: ${{ vars.RISK_USD }}
          MAX_LEVERAGE: ${{ vars.MAX_LEVERAGE }}
          STRATEGY: ${{ vars.STRATEGY }}
          SMC_ENTRY: ${{ vars.SMC_ENTRY }}
          SMC_REQUIRE_DISCOUNT: ${{ vars.SMC_REQUIRE_DISCOUNT }}
          SMC_REQUIRE_TREND: ${{ vars.SMC_REQUIRE_TREND }}
          SMC_MIN_DISP: ${{ vars.SMC_MIN_DISP }}
          SMC_MIN_FVG: ${{ vars.SMC_MIN_FVG }}
          SMC_EQUAL_LEVELS: ${{ vars.SMC_EQUAL_LEVELS }}
          SMC_SESSION: ${{ vars.SMC_SESSION }}
          SMC_HTF_POI: ${{ vars.SMC_HTF_POI }}
          SMC_MIN_RR: ${{ vars.SMC_MIN_RR }}
          SMC_MAX_FILL: ${{ vars.SMC_MAX_FILL }}
          SMC_MIN_VOL: ${{ vars.SMC_MIN_VOL }}
          SMC_BTC: ${{ vars.SMC_BTC }}
          SMC_BTC_ADX: ${{ vars.SMC_BTC_ADX }}
          SMC_BTC_STABLE: ${{ vars.SMC_BTC_STABLE }}
          SMC_MIN_SL: ${{ vars.SMC_MIN_SL }}
          SMC_SHORT_TREND: ${{ vars.SMC_SHORT_TREND }}
          SMC_COOLDOWN: ${{ vars.SMC_COOLDOWN }}
          SMC_BREAKER: ${{ vars.SMC_BREAKER }}
          FILTER_HTF_ADX: ${{ vars.FILTER_HTF_ADX }}
          FILTER_ADX: ${{ vars.FILTER_ADX }}
          FILTER_CHOP: ${{ vars.FILTER_CHOP }}
          FILTER_SLOPE: ${{ vars.FILTER_SLOPE }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "test" ]; then python bot.py --test
          elif [ "$MODE" = "backtest" ]; then python bot.py --backtest --candles 6000
          elif [ "$MODE" = "amd" ]; then python bot.py --amd --candles 6000
          elif [ "$MODE" = "smc" ]; then python bot.py --smc --candles 6000
          elif [ "$MODE" = "account" ]; then python bot.py --account \
              --balance "${{ github.event.inputs.balance }}" --margin "${{ github.event.inputs.margin }}" \
              --leverage "${{ github.event.inputs.leverage }}" --days "${{ github.event.inputs.days }}" \
              --sizing "${{ github.event.inputs.sizing }}" --risk "${{ github.event.inputs.risk }}" \
              --strategy "${{ github.event.inputs.strategy }}"
          else python bot.py
          fi

      - name: Save state (stops duplicate signals)
        if: github.event.inputs.mode == '' || github.event.inputs.mode == 'scan' || github.event.inputs.mode == 'smc'
        run: |
          git config user.name "sd-signal-bot"
          git config user.email "sd-signal-bot@users.noreply.github.com"
          git add state.json
          if [ -f smc_filters.json ]; then git add smc_filters.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "bot: update state"
            git pull --rebase --autostash || true
            git push || true
          fi
