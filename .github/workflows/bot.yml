name: FX Signal Bot

on:
  schedule:
    - cron: "7 * * * *"        # watchdog only: GitHub cron is often hours late. The live check runs in a
                               # ~5.5h loop (every 15 min) that starts its own successor when it ends.
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = normal live run (loop), test = send an FX bot status message"
        type: choice
        options: [scan, test]
        default: scan

permissions:
  contents: write
  actions: write      # lets the loop start the next loop run (workflow_dispatch)

concurrency:
  group: sd-signal-bot-${{ github.ref_name }}   # same group as before, so old and new loops never run together
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run FX bot
        timeout-minutes: 350
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "test" ]; then python fx_bot.py --test; exit 0; fi
          # Live loop: check now, then at :01 :16 :31 :46 UTC.
          # main = 330 min then hand over to a new run; other branches = 35 min test, nothing saved.
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "main" ]; then LOOP_MIN=330; else LOOP_MIN=35; fi
          END=$(( $(date +%s) + LOOP_MIN * 60 ))
          git config user.name "fx-signal-bot"
          git config user.email "fx-signal-bot@users.noreply.github.com"
          FIRST=1
          while true; do
            if [ $FIRST -eq 0 ]; then
              NOW=$(date +%s); M=$(( (NOW / 60) % 60 ))
              for T in 1 16 31 46 61; do if [ $T -gt $M ]; then NEXT=$T; break; fi; done
              WAIT=$(( (NEXT - M) * 60 - NOW % 60 ))
              if [ $(( NOW + WAIT )) -ge $END ]; then break; fi
              sleep $WAIT
            fi
            FIRST=0
            [ "$BRANCH" = "main" ] && { git pull --rebase --autostash -q || true; }
            echo "===== check $(date -u '+%F %T') UTC ====="
            timeout 3m python fx_bot.py || echo "fx bot failed, continuing"
            if [ "$BRANCH" = "main" ]; then
              [ -f fx_state.json ] && git add fx_state.json
              if ! git diff --cached --quiet; then
                git commit -qm "fx bot: update state"
                git pull --rebase --autostash -q || true
                git push -q || true
              fi
            fi
          done

      - name: Start next loop (keeps the bot running 24/7)
        if: (success() || failure()) && github.ref_name == 'main' && (github.event.inputs.mode == '' || github.event.inputs.mode == 'scan')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main -f mode=scan || echo "could not start next run (hourly watchdog cron will)"
