name: S&D Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may delay a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "scan = normal run, test = Telegram test message, backtest = check strategy on history"
        type: choice
        options: [scan, test, backtest]
        default: scan

permissions:
  contents: write

concurrency:
  group: sd-signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: ${{ vars.SYMBOLS }}
          TOP_N: ${{ vars.TOP_N }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          MIN_SL_PCT: ${{ vars.MIN_SL_PCT }}
          FEE_PCT: ${{ vars.FEE_PCT }}
          TIMEFRAME: ${{ vars.TIMEFRAME }}
          HTF: ${{ vars.HTF }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "test" ]; then python bot.py --test
          elif [ "$MODE" = "backtest" ]; then python bot.py --backtest --candles 6000
          else python bot.py
          fi

      - name: Save state (stops duplicate signals)
        if: github.event.inputs.mode == '' || github.event.inputs.mode == 'scan'
        run: |
          git config user.name "sd-signal-bot"
          git config user.email "sd-signal-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: update state"
            git pull --rebase --autostash || true
            git push || true
          fi
